[project]
name = "furikuripy"
version = "0.3.0"
description = ""
authors = [{ name = "Veids", email = "veidsme@gmail.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
dependencies = [
    "capstone>=5.0.1,<6",
    "pydantic>=2.6.1,<3",
    "rich>=14.2.0,<15",
    "typer>=0.21.0,<0.22",
    "pyyaml>=6.0.1,<7",
    "poetry-dynamic-versioning[plugin]>=1.2.0,<2",
    "iced-x86>=1.21.0,<2",
]

[project.scripts]
shellcode_obfuscation = "furikuripy.shellcode_obfuscation:app"

[dependency-groups]
dev = [
    "flake8>=7.0.0,<8",
    "flake8-bugbear>=25.11.29,<26",
    "ipython>=9.8.0,<10",
    "ipdb>=0.13.13,<0.14",
]

[tool.hatch.build.targets.sdist]
include = ["src/furikuripy"]

[tool.hatch.build.targets.wheel]
include = ["src/furikuripy"]

[tool.hatch.build.targets.wheel.sources]
"src/furikuripy" = "furikuripy"

[tool.poetry-dynamic-versioning]
enable = true
pattern = "(?P<base>\\d+\\.\\d+\\.\\d+)"
format = "{base}+{commit}"

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"
